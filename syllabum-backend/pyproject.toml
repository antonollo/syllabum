[project]
name = "syllabum-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "antonollo", email = "antoniogabrienunesmartins@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.141.1",
    "psycopg2-binary>=2.9.13",
    "pyjwt>=2.14.0",
    "python-dotenv>=1.2.3",
    "sqlmodel>=0.0.42",
]

[project.scripts]
syllabum-backend = "syllabum_backend:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
